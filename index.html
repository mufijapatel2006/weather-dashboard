<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>
        <p class="subtitle">Real-time weather information</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <p id="loading" class="loading">Loading...</p>
        <div id="error" class="error"></div>

        <div id="weatherCard" class="weather-card">
            <div class="location">
                <h2 id="cityName">City</h2>
                <p id="countryName">Country</p>
            </div>

            <div class="weather-main">
                <div class="temperature"><span id="temperature">--</span>°C</div>
                <div class="weather-info">
                    <p id="weatherDescription">Weather</p>
                    <p>💧 Humidity: <span id="humidity">--</span>%</p>
                    <p>💨 Wind Speed: <span id="windSpeed">--</span> km/h</p>
                </div>
            </div>

            <div class="details">
                <div class="detail-box">
                    <span>🌡️</span>
                    <h3>Temperature</h3>
                    <p><span id="tempDetail">--</span> °C</p>
                </div>
                <div class="detail-box">
                    <span>💧</span>
                    <h3>Humidity</h3>
                    <p><span id="humidityDetail">--</span> %</p>
                </div>
                <div class="detail-box">
                    <span>💨</span>
                    <h3>Wind Speed</h3>
                    <p><span id="windDetail">--</span> km/h</p>
                </div>
            </div>

            <p class="updated">Last updated: <span id="updatedTime">--</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
